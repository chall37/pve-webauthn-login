name: Check Upstream Updates

on:
  schedule:
    # Run daily at 9 AM UTC
    - cron: '0 9 * * *'
  workflow_dispatch: # Allow manual trigger

jobs:
  check-updates:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check upstream repositories for updates
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Repositories to monitor
          REPOS=(
            "proxmox/pve-access-control"
            "proxmox/pve-manager"
            "proxmox/pve-http-server"
            "proxmox/proxmox-widget-toolkit"
          )

          # File to store last known commits
          STATE_FILE=".github/upstream-state.json"

          # Initialize state if it doesn't exist
          if [ ! -f "$STATE_FILE" ]; then
            echo '{}' > "$STATE_FILE"
          fi

          UPDATES=""
          NEW_STATE="{}"

          for repo in "${REPOS[@]}"; do
            echo "Checking $repo..."

            # Get latest commit on default branch
            LATEST=$(gh api "repos/$repo/commits?per_page=1" --jq '.[0].sha' 2>/dev/null || echo "")
            LATEST_DATE=$(gh api "repos/$repo/commits?per_page=1" --jq '.[0].commit.committer.date' 2>/dev/null || echo "")
            LATEST_MSG=$(gh api "repos/$repo/commits?per_page=1" --jq '.[0].commit.message' 2>/dev/null | head -1 || echo "")

            if [ -z "$LATEST" ]; then
              echo "  Failed to fetch $repo"
              continue
            fi

            # Get previously known commit
            PREVIOUS=$(cat "$STATE_FILE" | jq -r ".\"$repo\" // empty")

            echo "  Latest: ${LATEST:0:7}"
            echo "  Previous: ${PREVIOUS:0:7}"

            # Update state
            NEW_STATE=$(echo "$NEW_STATE" | jq --arg repo "$repo" --arg sha "$LATEST" '. + {($repo): $sha}')

            # Check if changed
            if [ -n "$PREVIOUS" ] && [ "$LATEST" != "$PREVIOUS" ]; then
              echo "  -> UPDATED!"
              UPDATES="${UPDATES}\n- **$repo**: [\`${PREVIOUS:0:7}\` → \`${LATEST:0:7}\`](https://github.com/$repo/compare/${PREVIOUS}...${LATEST})\n  - Latest: $LATEST_MSG\n  - Date: $LATEST_DATE"
            elif [ -z "$PREVIOUS" ]; then
              echo "  -> New tracking (no previous state)"
            else
              echo "  -> No change"
            fi
          done

          # Output results (don't write state file yet - do it after branch checkout)
          if [ -n "$UPDATES" ]; then
            echo "has_updates=true" >> $GITHUB_OUTPUT
            # Use a delimiter for multiline output
            EOF=$(dd if=/dev/urandom bs=15 count=1 status=none | base64)
            echo "updates<<$EOF" >> $GITHUB_OUTPUT
            echo -e "$UPDATES" >> $GITHUB_OUTPUT
            echo "$EOF" >> $GITHUB_OUTPUT
            # Also output the new state JSON
            echo "new_state<<EOF_STATE" >> $GITHUB_OUTPUT
            echo "$NEW_STATE" >> $GITHUB_OUTPUT
            echo "EOF_STATE" >> $GITHUB_OUTPUT
          else
            echo "has_updates=false" >> $GITHUB_OUTPUT
          fi

      # Issue step runs FIRST (before PR)
      - name: Create or update issue
        if: steps.check.outputs.has_updates == 'true'
        id: issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          UPDATES: ${{ steps.check.outputs.updates }}
        run: |
          # Check if there's already an open issue with upstream-update label
          EXISTING=$(gh issue list --label "upstream-update" --state open --json number --jq '.[0].number // empty')

          # Write body to file
          {
            echo "## Upstream Proxmox Updates Detected"
            echo ""
            echo "The following upstream repositories have new commits since last acknowledged state:"
            echo ""
            echo "$UPDATES"
            echo ""
            echo "## Action Required"
            echo ""
            echo "1. Review the changes in the linked comparisons above"
            echo "2. Check if any changes affect:"
            echo "   - \`PVE::AccessControl\` (ticket/auth functions)"
            echo "   - \`PVE::HTTPServer::auth_handler\`"
            echo "   - \`PVE::Service::pveproxy\`"
            echo "   - \`PVE.window.LoginWindow\` (ExtJS)"
            echo "3. If changes affect compatibility:"
            echo "   - Test the plugin against updated Proxmox"
            echo "   - Update \`compatibility.json\` if a new PVE version needs to be added"
            echo "4. Merge the associated PR to acknowledge the upstream changes"
            echo "5. Close this issue when validated"
            echo ""
            echo "---"
            echo "*Last updated: $(date -u '+%Y-%m-%d %H:%M:%S UTC')*"
          } > /tmp/issue-body.md

          if [ -n "$EXISTING" ]; then
            echo "Updating existing issue #$EXISTING"
            gh issue edit "$EXISTING" --body-file /tmp/issue-body.md
            echo "issue_number=$EXISTING" >> $GITHUB_OUTPUT
          else
            echo "Creating new issue"
            ISSUE_URL=$(gh issue create \
              --title "Upstream Proxmox updates detected - validation required" \
              --body-file /tmp/issue-body.md \
              --label "upstream-update")
            ISSUE_NUMBER=$(echo "$ISSUE_URL" | grep -oE '[0-9]+$')
            echo "issue_number=$ISSUE_NUMBER" >> $GITHUB_OUTPUT
          fi

      # PR step runs AFTER issue
      - name: Create or update PR for state update
        if: steps.check.outputs.has_updates == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEW_STATE: ${{ steps.check.outputs.new_state }}
          ISSUE_NUMBER: ${{ steps.issue.outputs.issue_number }}
        run: |
          # Use a fixed branch name (not date-based) so we update the same PR
          BRANCH_NAME="upstream-state-update"

          # Check if branch already exists
          if git ls-remote --heads origin "$BRANCH_NAME" | grep -q "$BRANCH_NAME"; then
            echo "Branch $BRANCH_NAME already exists, updating it"
            git fetch origin "$BRANCH_NAME"
            git checkout -f "$BRANCH_NAME"
            git reset --hard origin/main
          else
            git checkout -b "$BRANCH_NAME"
          fi

          # Write the new state file
          echo "$NEW_STATE" > .github/upstream-state.json

          # Commit the state file update
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .github/upstream-state.json
          git commit -m "Update upstream state tracking" || {
            echo "No changes to commit"
            exit 0
          }

          # Push the branch
          git push -f origin "$BRANCH_NAME"

          # Check if PR already exists for this branch
          if EXISTING_PR=$(gh pr view "$BRANCH_NAME" --json number --jq '.number' 2>/dev/null); then
            echo "PR #$EXISTING_PR already exists (branch updated)"
          else
            echo "Creating new PR"
            # Write PR body to file
            {
              echo "## Upstream State Update"
              echo ""
              echo "This PR updates the upstream state tracking file to acknowledge the detected changes."
              echo ""
              if [ -n "$ISSUE_NUMBER" ]; then
                echo "Closes #$ISSUE_NUMBER"
                echo ""
              fi
              echo "Merge this PR after reviewing the associated issue and confirming compatibility."
              echo ""
              echo "---"
              echo "*This PR was automatically created by the upstream monitoring workflow.*"
            } > /tmp/pr-body.md

            gh pr create \
              --title "Update upstream state tracking" \
              --body-file /tmp/pr-body.md \
              --label "upstream-update"
          fi
