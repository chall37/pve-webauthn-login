name: Build and Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version number (e.g., 2025.12.0)'
        required: true
        type: string

jobs:
  build-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate version format
        run: |
          if ! echo "${{ inputs.version }}" | grep -qE '^[0-9]{4}\.[0-9]{1,2}\.[0-9]+$'; then
            echo "Error: Version must be in format YYYY.MM.micro (e.g., 2025.12.0)"
            exit 1
          fi

      - name: Extract latest changelog section
        id: changelog
        run: |
          # Extract content between first ## [version] and next ## [version] or end
          # Skip the [Unreleased] section, get the first actual version section
          CHANGELOG_CONTENT=$(awk '
            /^## \[Unreleased\]/ { next }
            /^## \[/ {
              if (found) exit
              found=1
              next
            }
            found { print }
          ' CHANGELOG.md)

          # If no versioned section found, check for unreleased content
          if [ -z "$CHANGELOG_CONTENT" ]; then
            CHANGELOG_CONTENT=$(awk '
              /^## \[Unreleased\]/ { found=1; next }
              /^## \[/ { exit }
              found && NF { print }
            ' CHANGELOG.md)
          fi

          # Fallback message if still empty
          if [ -z "$CHANGELOG_CONTENT" ] || [ "$(echo "$CHANGELOG_CONTENT" | tr -d '[:space:]')" = "" ]; then
            CHANGELOG_CONTENT="Release v${{ inputs.version }}"
          fi

          # Output for release notes
          EOF=$(dd if=/dev/urandom bs=15 count=1 status=none | base64)
          echo "notes<<$EOF" >> $GITHUB_OUTPUT
          echo "$CHANGELOG_CONTENT" >> $GITHUB_OUTPUT
          echo "$EOF" >> $GITHUB_OUTPUT

      - name: Update debian/changelog version
        run: |
          DATE=$(date -R)
          cat > debian/changelog << EOF
          pve-webauthn-login (${{ inputs.version }}) stable; urgency=medium

            * Release v${{ inputs.version }}

           -- github-actions[bot] <github-actions[bot]@users.noreply.github.com>  $DATE
          EOF

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y devscripts debhelper build-essential

      - name: Build .deb package
        run: |
          dpkg-buildpackage -us -uc -b

      - name: Import GPG key
        run: |
          echo "${{ secrets.GPG_PRIVATE_KEY }}" | base64 -d | gpg --import --batch
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}

      - name: Sign release artifacts
        run: |
          # Move .deb to current directory
          mv ../pve-webauthn-login_${{ inputs.version }}_all.deb .

          # Sign the .deb package
          gpg --armor --detach-sign pve-webauthn-login_${{ inputs.version }}_all.deb

          # Sign install.sh for auto-update verification
          gpg --armor --detach-sign install.sh

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_NOTES: ${{ steps.changelog.outputs.notes }}
        run: |
          # Write notes to file to avoid shell escaping issues
          echo "$RELEASE_NOTES" > release-notes.md

          # Create release with signed artifacts
          gh release create "v${{ inputs.version }}" \
            --title "v${{ inputs.version }}" \
            --notes-file release-notes.md \
            pve-webauthn-login_${{ inputs.version }}_all.deb \
            pve-webauthn-login_${{ inputs.version }}_all.deb.asc \
            install.sh \
            install.sh.asc
